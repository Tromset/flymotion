name: publish-ollama
# Every change to main that touches a Modelfile is published on ollama.com: the changed models are rebuilt and
# pushed as Tromset/<name>. The model pages are not updated here (ollama.com refuses API keys for that, HTTP 401):
# paste docs/ollama/<model>.md with the page's Edit button.
# Needs one repository secret (Settings > Secrets and variables > Actions):
#   OLLAMA_KEY  the private key ~/.ollama/id_ed25519 of a machine linked to the Tromset account (`ollama signin`)
on:
  push:
    branches: [main]
    paths:
      - 'Modelfile*'
      - 'scripts/publish-ollama.sh'
      - '.github/workflows/publish-ollama.yml'
  workflow_dispatch:
    inputs:
      models:
        description: 'Models to publish (space-separated names or "all")'
        default: all
concurrency:
  group: publish-ollama
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Tromset/flymotion'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLLAMA_KEY: ${{ secrets.OLLAMA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the models to publish
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
          REQUESTED: ${{ inputs.models }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            models=$REQUESTED
          elif ! changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null); then
            models=all
          else
            models=
            for file in $changed; do
              case $file in
                Modelfile) models="$models flymotion0.2" ;;
                Modelfile.lite) models="$models flymotion0.2lite" ;;
                scripts/publish-ollama.sh|.github/workflows/publish-ollama.yml) models=all; break ;;
              esac
            done
          fi
          [ -n "$models" ] || models=none
          echo "Models to publish: $models"
          echo "models=$models" >> "$GITHUB_OUTPUT"

      - name: Check the secrets
        run: |
          [ -n "$OLLAMA_KEY" ] || { echo "::error::Add the OLLAMA_KEY secret (contents of ~/.ollama/id_ed25519 from a machine signed in to the Tromset account)."; exit 1; }

      - name: Start Ollama with the Tromset key
        if: steps.pick.outputs.models != 'none'
        run: |
          sudo apt-get install -y zstd >/dev/null
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl disable --now ollama || true
          # Pushes are signed by the server with ~/.ollama/id_ed25519: run it as this user.
          mkdir -p ~/.ollama && chmod 700 ~/.ollama
          printf '%s\n' "$OLLAMA_KEY" > ~/.ollama/id_ed25519 && chmod 600 ~/.ollama/id_ed25519
          ssh-keygen -y -f ~/.ollama/id_ed25519 > ~/.ollama/id_ed25519.pub
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 30); do ollama list >/dev/null 2>&1 && break; sleep 1; done
          ollama --version

      - name: Build and push the models
        if: steps.pick.outputs.models != 'none'
        env:
          FLYMOTION_PRUNE: '1'
          MODELS: ${{ steps.pick.outputs.models }}
        run: |
          # MODELS is a space-separated list of names: split it on purpose.
          # shellcheck disable=SC2086
          if [ "$MODELS" = all ]; then sh scripts/publish-ollama.sh Tromset; else sh scripts/publish-ollama.sh Tromset $MODELS; fi

      - name: Remove the key
        if: always()
        run: rm -f ~/.ollama/id_ed25519 ~/.ollama/id_ed25519.pub
